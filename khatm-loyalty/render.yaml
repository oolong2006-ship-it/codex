# Render Blueprint for a free public demo of Khatm.
# In Render: New → Blueprint → pick this repo → Blueprint file path: khatm-loyalty/render.yaml
# Free web services sleep after ~15 min idle (first request takes ~1 min to wake).
# Render's free Postgres expires after 30 days — for a permanent free DB, use Neon and set DATABASE_URL instead.
services:
  - type: web
    name: khatm-loyalty
    runtime: node
    plan: free
    region: frankfurt
    rootDir: khatm-loyalty
    buildCommand: npm ci && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: khatm-db
          property: connectionString
      - key: CARD_TOKEN_KEYS
        generateValue: true
      - key: WALLET_PROVIDER
        value: mock
      - key: MESSAGING_PROVIDER
        value: console
      - key: DEMO_SEED
        value: "1"
      - key: SEED_PASSWORD
        sync: false   # Render asks for it on creation: the demo dashboard password (10+ chars)

databases:
  - name: khatm-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
