name: Majlis CI

on:
  push:
    paths: ["majlis/**", ".github/workflows/majlis-ci.yml"]
  pull_request:
    paths: ["majlis/**", ".github/workflows/majlis-ci.yml"]

defaults:
  run:
    working-directory: majlis

jobs:
  node:
    name: Node (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: majlis
          POSTGRES_PASSWORD: majlis_ci_password
          POSTGRES_DB: majlis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majlis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://majlis:majlis_ci_password@localhost:5432/majlis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: majlis/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: majlis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    name: Voice path in a real browser (Chromium, fake mic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: majlis/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: majlis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@majlis/voice-gateway...
      - run: pnpm --filter @majlis/voice-gateway exec playwright install --with-deps chromium
      - run: pnpm --filter @majlis/voice-gateway test:browser

  journey:
    name: E2E journey (study → consent → interview → results, RTL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: majlis
          POSTGRES_PASSWORD: majlis_ci_password
          POSTGRES_DB: majlis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majlis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://majlis:majlis_ci_password@localhost:5432/majlis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: majlis/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: majlis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @majlis/web exec playwright install --with-deps chromium
      - run: pnpm --filter @majlis/web test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-screenshots
          path: majlis/apps/web/e2e/artifacts/
          if-no-files-found: ignore

  voice-lab:
    name: Voice lab (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: majlis/voice-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
