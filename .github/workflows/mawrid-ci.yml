# =====================================================================
#  مَورِد — فحص تلقائي عند كل دفع يمس mawrid/web
#  الأنواع + اختبارات الوحدة + اختبارات قاعدة البيانات (RLS والبحث) + البناء
# =====================================================================
name: مورد — CI

on:
  push:
    paths:
      - 'mawrid/web/**'
      - '.github/workflows/mawrid-ci.yml'
  pull_request:
    paths:
      - 'mawrid/web/**'
      - '.github/workflows/mawrid-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: mawrid/web

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mawrid/web/package-lock.json
      - run: npm ci
      - name: فحص الأنواع
        run: npm run typecheck
      - name: اختبارات الوحدة
        run: npm test
      - name: اختبارات قاعدة البيانات
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run db:test
      - name: البناء
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
