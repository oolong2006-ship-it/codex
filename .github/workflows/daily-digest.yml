name: Daily digest

# Runs the personal job hunter in job-hunter/. All personal data lives in
# repository secrets; the run prints counts only, and nothing is committed or
# uploaded as an artifact (artifacts on a public repo are downloadable).
# Scheduled runs only fire from the repository's default branch.

on:
  schedule:
    - cron: "17 4 * * *" # 07:17 Riyadh time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: job-hunter
    env:
      JOBHUNTER_PROFILE_JSON: ${{ secrets.JOBHUNTER_PROFILE_JSON }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOBHUNTER_DATA: data
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$JOBHUNTER_PROFILE_JSON" ]; then
            echo "JOBHUNTER_PROFILE_JSON secret is not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Restore tracker
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: job-hunter/data
          key: jobhunter-db-${{ github.run_id }}
          restore-keys: jobhunter-db-
      - name: Run
        if: steps.cfg.outputs.ready == 'true'
        run: python -m jobhunter run --quiet
      - name: Save tracker
        if: steps.cfg.outputs.ready == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: job-hunter/data
          key: jobhunter-db-${{ github.run_id }}
