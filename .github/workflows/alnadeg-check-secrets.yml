# =====================================================================
#  فحص المفاتيح — شغّله أولًا
#
#  يخبرك أي المفاتيح مضبوط وأيها ناقص، دون كشف أي قيمة.
#  لا يتصل بـ Supabase ولا يعدّل شيئًا — يفحص وجود الأسرار فقط.
# =====================================================================
name: فحص المفاتيح

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: فحص الأسرار المضبوطة
    runs-on: ubuntu-latest
    steps:
      - name: الفحص
        env:
          ANON:  ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SRK:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # لا تُطبع أي قيمة — فقط الطول والشكل العام
          shape() {
            local v="$1"
            if [ -z "$v" ]; then echo "❌ غير مضبوط"; return; fi
            local n=${#v}
            case "$v" in
              eyJ*)            echo "✅ مضبوط ($n حرفًا، يبدأ بـ eyJ)" ;;
              sb_publishable*) echo "✅ مضبوط ($n حرفًا، مفتاح publishable)" ;;
              sb_secret*)      echo "⚠️ مضبوط لكنه مفتاح سرّي — تحقق أنه في الحقل الصحيح" ;;
              sbp_*)           echo "✅ مضبوط ($n حرفًا، رمز وصول شخصي)" ;;
              postgresql://*|postgres://*)
                case "$v" in
                  *YOUR-PASSWORD*|*\[*\]*) echo "⚠️ مضبوط لكن كلمة المرور لم تُستبدل" ;;
                  *) echo "✅ مضبوط ($n حرفًا، سلسلة اتصال سليمة الشكل)" ;;
                esac ;;
              *) echo "⚠️ مضبوط ($n حرفًا) لكن شكله غير متوقع" ;;
            esac
          }

          A=$(shape "$ANON"); D=$(shape "$DBURL"); T=$(shape "$TOKEN"); S=$(shape "$SRK")

          {
            echo "## 🔑 حالة المفاتيح"
            echo ""
            echo "| المفتاح | الحالة | مطلوب لـ |"
            echo "|---|---|---|"
            echo "| \`NEXT_PUBLIC_SUPABASE_ANON_KEY\` | $A | نشر الواجهة |"
            echo "| \`SUPABASE_DB_URL\` | $D | تهيئة قاعدة البيانات |"
            echo "| \`SUPABASE_ACCESS_TOKEN\` | $T | نشر الخدمة |"
            echo "| \`SUPABASE_SERVICE_ROLE_KEY\` | $S | اختبارات القبول (اختياري) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ANON" ] && [ -n "$DBURL" ] && [ -n "$TOKEN" ]; then
            {
              echo "### ✅ المفاتيح الثلاثة الأساسية جاهزة"
              echo ""
              echo "شغّل الآن **«تهيئة قاعدة البيانات والخدمة»** ثم **«نشر الواجهة»**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ ما زالت هناك مفاتيح ناقصة"
              echo ""
              echo "أضفها من: **Settings → Secrets and variables → Actions → New repository secret**"
              echo ""
              echo "| المفتاح | من أين تنسخه |"
              echo "|---|---|"
              echo "| \`NEXT_PUBLIC_SUPABASE_ANON_KEY\` | Supabase → Project Settings → **API Keys** → مفتاح \`anon\` \`public\` (أو \`publishable\`) |"
              echo "| \`SUPABASE_DB_URL\` | Supabase → Project Settings → **Database** → Connection string → تبويب **URI** |"
              echo "| \`SUPABASE_ACCESS_TOKEN\` | supabase.com/dashboard/account/tokens → Generate new token |"
              echo ""
              echo "> الاسم يجب أن يطابق الجدول حرفًا بحرف — بحروف كبيرة وبشرطات سفلية."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::مفاتيح ناقصة — راجع الملخص أعلاه"
            exit 1
          fi
