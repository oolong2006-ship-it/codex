# =====================================================================
#  نشر واجهة بوابة مشتريات الناضج على GitHub Pages
#
#  يعمل تلقائيًا عند كل دفع للفرع، ويمكن تشغيله يدويًا من تبويب Actions.
#  المفاتيح المطلوبة في: Settings → Secrets and variables → Actions
#    • NEXT_PUBLIC_SUPABASE_ANON_KEY   (مفتاح anon العام — وليس service_role)
#    • NEXT_PUBLIC_SUPABASE_URL        (اختياري، له قيمة افتراضية)
# =====================================================================
name: نشر الواجهة — بوابة المشتريات

on:
  workflow_dispatch:
  push:
    branches: [claude/alnadeg-procurement-portal-6urp3o]
    paths:
      - 'alnadeg-procurement/**'
      - '.github/workflows/alnadeg-deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alnadeg-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: alnadeg-procurement

jobs:
  build:
    name: بناء الواجهة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: حالة الربط
        id: cfg
        env:
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # غياب المفتاح لم يعد يمنع النشر: الموقع يُنشر ويعرض شاشة ربط
          # يضع فيها المدير القيمتين بنفسه. وجود المفتاح يجعل الربط تلقائيًا.
          if [ -z "$ANON" ]; then
            echo "linked=false" >> "$GITHUB_OUTPUT"
            echo "::warning::المفتاح العام غير مضبوط — سيُنشر الموقع بشاشة ربط يدوي"
          else
            echo "linked=true" >> "$GITHUB_OUTPUT"
            echo "✅ المفتاح موجود — سيُربط الموقع تلقائيًا"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: alnadeg-procurement/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: اختبارات الوحدة
        run: npm test

      - name: بناء الواجهة
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://wdtylpgeyjuetarwtbev.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: تعطيل معالجة Jekyll لمجلد _next
        run: touch out/.nojekyll

      - name: فحص الحزمة من تسرّب مفاتيح الخادم
        run: node scripts/scan-bundle.mjs out

      # تفعيل Pages أول مرة يتطلب صلاحية لا يملكها رمز سير العمل،
      # لذا لا نُفشل التشغيل هنا بل نوضّح النقرة المطلوبة بدقة.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - name: التحقق من تفعيل GitHub Pages
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ خطوة واحدة مطلوبة منك — نقرة واحدة"
            echo ""
            echo "**كل شيء آخر نجح:** التثبيت، فحص الأنواع، الاختبارات،"
            echo "البناء، وفحص تسرّب المفاتيح. المتبقي هو تفعيل الاستضافة."
            echo ""
            echo "### ما تفعله"
            echo ""
            echo "1. افتح: **Settings ← Pages**"
            echo "   https://github.com/${{ github.repository }}/settings/pages"
            echo "2. تحت **Source** اختر: **GitHub Actions**"
            echo "3. هذا كل شيء — لا تحتاج حفظًا ولا إعدادًا آخر."
            echo ""
            echo "### لماذا لا أستطيع فعلها عنك"
            echo ""
            echo "إنشاء موقع Pages أول مرة يتطلب صلاحية مالك المستودع،"
            echo "ورمز سير العمل لا يملكها — وهذا قيد من GitHub نفسه لا خلل"
            echo "في الإعداد. بعد هذه النقرة الواحدة يتولى سير العمل كل"
            echo "عمليات النشر تلقائيًا إلى الأبد."
            echo ""
            echo "بعدها أعد تشغيل سير العمل هذا وسيكتمل النشر."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages غير مفعّلة — افتح Settings ← Pages واختر GitHub Actions"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: alnadeg-procurement/out

  deploy:
    name: نشر على GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4

      - name: تلخيص النتيجة
        run: |
          {
            echo "## ✅ تم نشر الواجهة"
            echo ""
            echo "**رابط البوابة:** ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "### الخطوة التالية"
            echo "شغّل سير العمل **«تهيئة قاعدة البيانات والخدمة»** من تبويب Actions."
            echo ""
            echo "إن ظهرت شاشة «ربط البوابة» عند الفتح، فذلك متوقع: الصق فيها"
            echo "عنوان المشروع والمفتاح العام من Supabase وستعمل البوابة فورًا."
          } >> "$GITHUB_STEP_SUMMARY"
