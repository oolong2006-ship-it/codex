# =====================================================================
#  نشر واجهة بوابة مشتريات الناضج على GitHub Pages
#
#  يعمل تلقائيًا عند كل دفع للفرع، ويمكن تشغيله يدويًا من تبويب Actions.
#  المفاتيح المطلوبة في: Settings → Secrets and variables → Actions
#    • NEXT_PUBLIC_SUPABASE_ANON_KEY   (مفتاح anon العام — وليس service_role)
#    • NEXT_PUBLIC_SUPABASE_URL        (اختياري، له قيمة افتراضية)
# =====================================================================
name: نشر الواجهة — بوابة المشتريات

on:
  workflow_dispatch:
  push:
    branches: [claude/alnadeg-procurement-portal-6urp3o]
    paths:
      - 'alnadeg-procurement/**'
      - '.github/workflows/alnadeg-deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alnadeg-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: alnadeg-procurement

jobs:
  build:
    name: بناء الواجهة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: حالة الربط
        id: cfg
        env:
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # غياب المفتاح لم يعد يمنع النشر: الموقع يُنشر ويعرض شاشة ربط
          # يضع فيها المدير القيمتين بنفسه. وجود المفتاح يجعل الربط تلقائيًا.
          if [ -z "$ANON" ]; then
            echo "linked=false" >> "$GITHUB_OUTPUT"
            echo "::warning::المفتاح العام غير مضبوط — سيُنشر الموقع بشاشة ربط يدوي"
          else
            echo "linked=true" >> "$GITHUB_OUTPUT"
            echo "✅ المفتاح موجود — سيُربط الموقع تلقائيًا"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: alnadeg-procurement/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: اختبارات الوحدة
        run: npm test

      - name: بناء الواجهة
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://wdtylpgeyjuetarwtbev.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: تعطيل معالجة Jekyll لمجلد _next
        run: touch out/.nojekyll

      - name: فحص الحزمة من تسرّب مفاتيح الخادم
        run: node scripts/scan-bundle.mjs out

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: alnadeg-procurement/out

  deploy:
    name: نشر على GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4

      - name: تلخيص النتيجة
        run: |
          {
            echo "## ✅ تم نشر الواجهة"
            echo ""
            echo "**رابط البوابة:** ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "### الخطوة التالية"
            echo "شغّل سير العمل **«تهيئة قاعدة البيانات والخدمة»** من تبويب Actions."
            echo ""
            echo "إن ظهرت شاشة «ربط البوابة» عند الفتح، فذلك متوقع: الصق فيها"
            echo "عنوان المشروع والمفتاح العام من Supabase وستعمل البوابة فورًا."
          } >> "$GITHUB_STEP_SUMMARY"
