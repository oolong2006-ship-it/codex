name: Smart Attendance CI

on:
  push:
    paths: ["smart-attendance/**", ".github/workflows/smart-attendance-ci.yml"]
  pull_request:
    paths: ["smart-attendance/**", ".github/workflows/smart-attendance-ci.yml"]

defaults:
  run:
    working-directory: smart-attendance

jobs:
  verify:
    name: lint, typecheck, unit, e2e (Postgres 16 + PostGIS + RLS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sa_owner
          POSTGRES_PASSWORD: sa_owner_dev
          POSTGRES_DB: smart_attendance
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U sa_owner -d smart_attendance"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["63799:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgres://sa_owner:sa_owner_dev@localhost:54329/smart_attendance
      DATABASE_APP_URL: postgres://sa_app:sa_app_dev@localhost:54329/smart_attendance
      DATABASE_PLATFORM_URL: postgres://sa_platform:sa_platform_dev@localhost:54329/smart_attendance
      REDIS_URL: redis://localhost:63799
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: smart-attendance/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @sa/admin build
      # e2e تنشئ قاعدة <db>_test نظيفة وتطبق migrations وseed بنفسها.
      - run: pnpm test
      - name: OpenAPI is up to date
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-00
          MFA_ENC_KEY: Y2ktb25seS1tZmEta2V5LTMyLWJ5dGVzLWxvbmchISE=
          CODE_HMAC_KEY: Y2ktb25seS1jb2RlLWhtYWMta2V5LTMyYnl0ZXMhISE=
        run: |
          pnpm --filter @sa/domain build
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (smart-attendance tree)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          dir /repo/smart-attendance --config /repo/smart-attendance/.gitleaks.toml --redact --exit-code 1
