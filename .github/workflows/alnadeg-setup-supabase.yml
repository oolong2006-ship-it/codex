# =====================================================================
#  تهيئة قاعدة البيانات ونشر الواجهة البرمجية
#
#  يُشغَّل يدويًا من تبويب Actions. يطبّق الهجرات ثم ينشر Edge Function.
#
#  الأسرار المطلوبة:
#    • SUPABASE_DB_URL        سلسلة اتصال قاعدة البيانات
#                             (Project Settings → Database → Connection string → URI)
#    • SUPABASE_ACCESS_TOKEN  رمز وصول شخصي من supabase.com/dashboard/account/tokens
# =====================================================================
name: تهيئة قاعدة البيانات والخدمة

on:
  workflow_dispatch:
    inputs:
      apply_database:
        description: 'تطبيق هجرات قاعدة البيانات'
        type: boolean
        default: true
      deploy_function:
        description: 'نشر الواجهة البرمجية (Edge Function)'
        type: boolean
        default: true
      project_ref:
        description: 'معرّف مشروع Supabase'
        type: string
        default: 'wdtylpgeyjuetarwtbev'

permissions:
  contents: read

concurrency:
  group: alnadeg-supabase
  cancel-in-progress: false

defaults:
  run:
    working-directory: alnadeg-procurement

jobs:
  setup:
    name: تهيئة Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت عميل PostgreSQL
        if: inputs.apply_database
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: التحقق من سلسلة الاتصال
        if: inputs.apply_database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            {
              echo "## ❌ سلسلة اتصال قاعدة البيانات غير مضبوطة"
              echo ""
              echo "أضف السر \`SUPABASE_DB_URL\` من:"
              echo "Supabase → **Project Settings → Database → Connection string → URI**"
              echo ""
              echo "ثم ضعه في: **Settings → Secrets and variables → Actions**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::السر SUPABASE_DB_URL غير مضبوط"
            exit 1
          fi

      - name: فحص ما قبل التنصيب
        if: inputs.apply_database
        env:
          PGPASSWORD_HIDDEN: 1
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          echo "## 🔍 فحص ما قبل التنصيب" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off \
            -f deploy/00-preflight.sql 2>&1 | tee /tmp/preflight.txt
          {
            echo '```'
            head -40 /tmp/preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q '❌' /tmp/preflight.txt; then
            {
              echo ""
              echo "### ⚠️ الفحص أظهر تعارضًا"
              echo "قاعدتك تحتوي أعمدة بأنواع مخصصة. شغّل ملف الإصلاح أولًا:"
              echo "الصق \`deploy/00b-fix-column-types.sql\` في Supabase SQL Editor،"
              echo "ثم أعد تشغيل سير العمل هذا."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::الفحص أظهر تعارضًا — راجع الملخص"
            exit 1
          fi

      - name: تطبيق الهجرات
        if: inputs.apply_database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off \
            -f deploy/01-database.sql 2>&1 | tee /tmp/install.txt
          {
            echo ""
            echo "## 🗄️ نتيجة تنصيب قاعدة البيانات"
            echo ""
            echo '```'
            tail -20 /tmp/install.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q '❌ يحتاج مراجعة' /tmp/install.txt; then
            echo "::error::أحد بنود التحقق لم ينجح"
            exit 1
          fi
          echo "✅ نجح تنصيب قاعدة البيانات"

      - name: تثبيت أداة Supabase
        if: inputs.deploy_function
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: نشر الواجهة البرمجية
        if: inputs.deploy_function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            {
              echo ""
              echo "## ❌ رمز الوصول غير مضبوط"
              echo "أنشئ رمزًا من supabase.com/dashboard/account/tokens"
              echo "وأضفه كسر باسم \`SUPABASE_ACCESS_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::السر SUPABASE_ACCESS_TOKEN غير مضبوط"
            exit 1
          fi

          # النطاق المسموح هو أصل الموقع دون المسار الفرعي
          supabase secrets set "ALLOWED_ORIGINS=$SITE_ORIGIN" --project-ref "$PROJECT_REF"

          supabase functions deploy procurement-portal \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

          {
            echo ""
            echo "## ⚡ تم نشر الواجهة البرمجية"
            echo ""
            echo "| البند | القيمة |"
            echo "|---|---|"
            echo "| اسم الدالة | \`procurement-portal\` |"
            echo "| النطاق المسموح | \`$SITE_ORIGIN\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: فحص صحة الخدمة
        if: inputs.deploy_function
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          URL="https://$PROJECT_REF.supabase.co/functions/v1/procurement-portal/health"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              {
                echo ""
                echo "### ✅ الخدمة تعمل"
                echo '```json'
                cat /tmp/health.txt
                echo ""
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "محاولة $i — الرمز $CODE، إعادة المحاولة بعد 10 ثوانٍ…"
            sleep 10
          done
          echo "::warning::لم تستجب الخدمة بالرمز 200 بعد خمس محاولات"

      - name: الخطوة التالية
        if: success()
        run: |
          {
            echo ""
            echo "---"
            echo "### الخطوة التالية"
            echo "شغّل سير العمل **«إنشاء رابط تفعيل المدير»** للحصول على رابط الدخول."
          } >> "$GITHUB_STEP_SUMMARY"
