# Local development dependencies only. Not a production deployment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: majlis_dev_password
      POSTGRES_DB: majlis
    ports:
      - "5432:5432"
    volumes:
      - majlis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: majlis
      MINIO_ROOT_PASSWORD: majlis_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - majlis_minio:/data

volumes:
  majlis_pg:
  majlis_minio:
