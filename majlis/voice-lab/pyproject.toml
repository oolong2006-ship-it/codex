[project]
name = "majlis-voice-lab"
version = "0.0.0"
description = "Provider benchmarking for Majlis: per-dialect WER/CER, TTS blind A/B (MOS), end-to-end latency"
requires-python = ">=3.11"
dependencies = [
  "jiwer>=3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
faster-whisper = ["faster-whisper>=1.0"]
transformers = ["transformers>=4.40", "torch>=2.2"]
chatterbox = ["chatterbox-tts>=0.1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["majlis_voice_lab", "majlis_voice_lab.providers"]

[tool.setuptools.package-data]
majlis_voice_lab = ["listening.html"]
