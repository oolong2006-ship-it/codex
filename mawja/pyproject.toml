[project]
name = "mawja"
version = "0.1.0"
description = "Mawja: AI traffic-signal simulation on Olaya Street, Riyadh"
requires-python = ">=3.10"
dependencies = [
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "numpy",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
# RL signal agent (Task 8). CPU-only torch: pip install torch --index-url
# https://download.pytorch.org/whl/cpu  (or the default wheel; no GPU is used).
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "torch>=2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
