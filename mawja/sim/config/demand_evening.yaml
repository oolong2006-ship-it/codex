# ESTIMATED evening-peak demand (16:00-18:00), Olaya Street, Riyadh.
# IMPORTANT: all volumes below are estimates, not measured counts (UI shows them as «تقديري»).
estimated: true
peak: "16:00-18:00"
duration_s: 7200
olaya_veh_per_hour:        # per direction, at each corridor end
  northbound: 1800
  southbound: 1800
cross_veh_per_hour:        # per cross-street entry (west side and east side each)
  # Calibrated (ruling R9): first estimate 900/400 gridlocked even the Webster green-wave
  # plan (2.1% of demand never entered); 700/300 keeps fixed-time heavy but not gridlocked.
  major: 700
  minor: 300
default_turns:             # share of vehicles turning at a junction; rest go straight
  left: 0.15
  right: 0.15
intersections:             # cross-street class per junction (turn overrides optional: turns: {left, right})
  olaya_musa_bin_nusair: {cross_class: minor}
  olaya_tahlia: {cross_class: major}
  olaya_prince_turki: {cross_class: minor}
  olaya_urubah: {cross_class: major}
  olaya_king_abdullah: {cross_class: major}
  olaya_anas_bin_malik: {cross_class: minor}
