# طاقم — تشغيل كامل المنصة بأمر واحد: docker compose up --build
# ⚠️ للتطوير المحلي فقط (كلمات مرور تجريبية). للخادم الحقيقي استخدم deploy/docker-compose.prod.yml (انظر deploy/README.md).
#    المنافذ مربوطة بـ 127.0.0.1: Docker يتجاوز جدار ufw، فربطها بكل العناوين يكشفها للإنترنت.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taqam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taqam_dev}
      POSTGRES_DB: taqam
    volumes:
      - taqam_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taqam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://taqam:${POSTGRES_PASSWORD:-taqam_dev}@db:5432/taqam?schema=public
      # required: the API refuses to boot in production without a JWT_SECRET of 32+ chars (see apps/api/.env.example)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars) in taqam/.env, e.g. JWT_SECRET=$(openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      PORT: 4100
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      db:
        condition: service_healthy

  # بيانات تجريبية (اختياري): docker compose --profile demo up --build
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://taqam:${POSTGRES_PASSWORD:-taqam_dev}@db:5432/taqam?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100/api}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - api

volumes:
  taqam_pg:
