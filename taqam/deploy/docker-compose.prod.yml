# شؤون — تشغيل الإنتاج على خادم واحد (انظر deploy/README.md)
#   cd taqam/deploy && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Caddy يصدر شهادات HTTPS تلقائياً لـ www.$DOMAIN و api.$DOMAIN ويحوّل $DOMAIN إلى www.
name: shuoon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shuoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: shuoon
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuoon -d shuoon"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://shuoon:${POSTGRES_PASSWORD}@db:5432/shuoon?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: https://www.${DOMAIN},https://${DOMAIN}
      TRUST_PROXY: "1"
      API_DOCS: ${API_DOCS:-false}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL in deploy/.env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in deploy/.env}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-مدير المنصة}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-شؤون <hello@shuoon.net>}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?set DOMAIN in deploy/.env}/api
        NEXT_PUBLIC_SITE_URL: https://www.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # نسخة احتياطية يومية لقاعدة البيانات في deploy/backups (تُحذف الأقدم من BACKUP_KEEP_DAYS يوماً)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: shuoon
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shuoon
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Riyadh
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
