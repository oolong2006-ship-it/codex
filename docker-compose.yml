# Local PostgreSQL for Supplier Intelligence Hub development.
#   docker compose up -d
# Then set DATABASE_URL in .env to:
#   postgresql://postgres:postgres@localhost:5432/supplier_hub?schema=public
services:
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplier_hub
    ports:
      - "5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sih_pgdata:
